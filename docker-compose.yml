services:

  backend:
    build: .
    container_name: codered-api
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock   # gives backend access to host Docker
      - /tmp:/tmp                                    # shared temp dir for code files

  matchmaking-worker:
    build: .
    command: uv run python -m workers.matchmaking_worker
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - .:/app

  disconnect-worker:
    build: .
    command: uv run python -m workers.disconnect_listener
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - .:/app

  redis:
    image: redis:7-alpine
    container_name: codered-redis
    ports:
      - "6379:6379"
    command: redis-server --notify-keyspace-events Ex