apiVersion: apps/v1
kind: Deployment
metadata:
  name: codered-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codered-redis
  template:
    metadata:
      labels:
        app: codered-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--notify-keyspace-events", "Ex"]
---
apiVersion: v1
kind: Service
metadata:
  name: codered-redis
spec:
  selector:
    app: codered-redis
  ports:
    - port: 6379
      targetPort: 6379